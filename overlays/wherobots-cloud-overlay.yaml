overlay: 1.0.0
info:
  title: API Evangelist enhancements for Wherobots Cloud API
  version: 1.0.0
extends: openapi/wherobots-cloud-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-provider: wherobots
    x-apievangelist-category: geospatial-analytics
    x-apievangelist-auth: API key (X-API-Key) or OAuth bearer
    x-apievangelist-pagination: cursor (cursor/limit/offset)
    x-apievangelist-error-format: fastapi-detail
    x-apievangelist-sql-row-cap: 1000
    x-apievangelist-status-page: https://status.wherobots.com
    x-apievangelist-compliance: [SOC 2, GDPR]
    x-apievangelist-mcp: published (hosted, us-west-2)
    x-apievangelist-cli: https://github.com/wherobots/wherobots-cli
