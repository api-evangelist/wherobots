name: Wherobots
description: >-
  Wherobots is a managed cloud platform for geospatial analytics and spatial AI at
  planetary scale, built by the creators of Apache Sedona. WherobotsDB is a distributed
  Spatial SQL engine with 300+ spatial functions, raster and vector processing
  (RasterFlow), Havasu (Apache Iceberg-compatible) tables, and data federation across
  AWS Glue, Databricks Unity Catalog and S3. Developers reach it through the Wherobots
  Cloud API and a Spatial SQL API, with Python (DB-API), JDBC and TypeScript SDKs, a
  CLI, an Apache Airflow provider, a hosted MCP server, and agent skills for
  AI-assisted geospatial development.
