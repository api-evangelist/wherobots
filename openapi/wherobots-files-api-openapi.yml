        in: query
        required: true
        schema:
          type: string
          title: Name
      - name: dir
        in: query
        required: true
        schema:
          type: string
          title: Dir
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
