                $ref: '#/components/schemas/ErrorBody'
      x-exclude-from-cli: true
      x-excluded: true
  /files/rename:
    post:
      tags:
      - files
      summary: Rename a file in managed storage (legacy)
      operationId: renameFile
      security:
      - bearerToken: []
      - wherobotsApiKey: []
      parameters:
      - name: key
        in: query
        required: true
        schema:
          type: string
          title: Key
      - name: new_name
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9\!\-\_\.\*\'\(\)]+$
          title: New Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Unauthorized
