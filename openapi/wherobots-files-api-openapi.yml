  /files/ingest-credentials:
    post:
      tags:
      - files
      summary: Create temporary ingest credentials (legacy)
      operationId: createIngestCredentials
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestCredentials'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
