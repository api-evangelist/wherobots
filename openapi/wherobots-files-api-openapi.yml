        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerToken: []
      - wherobotsApiKey: []
      x-exclude-from-cli: true
      x-excluded: true
  /files/folder:
    post:
      tags:
      - files
      summary: Create a folder in managed storage (legacy)
      operationId: createFolder
      security:
      - bearerToken: []
      - wherobotsApiKey: []
      parameters:
