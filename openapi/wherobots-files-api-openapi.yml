  /files/upload-url:
    post:
      tags:
      - files
      summary: Create a file upload URL (legacy)
      operationId: createUploadUrl
      security:
      - bearerToken: []
      - wherobotsApiKey: []
      parameters:
      - name: key
        in: query
        required: true
        schema:
          type: string
          title: Key
      responses:
        '200':
          description: Successful Response
          content:
